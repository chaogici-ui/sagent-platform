# HTTP 拨测 采集参数声明（L3 层：随插件包走，平台读它渲染表单）
plugin: http_response
title: HTTP 拨测 采集参数
fields:
  - name: address
    label: 目标地址
    type: string
    required: true
    placeholder: https://example.com/health
    probe: tcp
    help: 从代理机可达的地址，不是从浏览器可达

  - name: port
    label: 端口
    type: int
    default: 443
    required: true
    probe: tcp

  - name: mode
    label: 部署形态
    type: enum
    options: [single, cluster]
    default: single
  - name: interval
    label: 采集频率
    type: duration
    default: 30s
    help: 不低于 5s

  - name: extra_labels
    label: 附加标签
    type: kv
    help: 形如 env=prod,app=order，逗号分隔
