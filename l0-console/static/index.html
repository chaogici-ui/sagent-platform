<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAgent 采集平台</title>
    <link rel="stylesheet" href="css/style.css?v=17" />
  </head>
  <body>
    <!-- Sidebar -->
    <nav>
      <div class="logo">SAgent 采集平台<small>Collect · Govern · Observe</small></div>
      <!-- 菜单按「接入→采集配置→运维观测」闭环叙事分 5 组（2026-09-26 IA 整合设计定稿，
           设计稿：DESIGN-采集平台IA整合设计-菜单与页面规范.html）。改名对照：
           资源与接入→接入中心 / 实时总览→采集目标(降只读) / 采集策略→插件与策略 / 分析大屏→指标大屏。
           页面 id（data-page）全部不变，goPage 深链与历史链接零影响；数据治理、平台健康两页为 P2 新增（platform.js）。 -->
      <div class="nav-section">总览健康</div>
      <a data-page="overview" onclick="goPage('overview')">◧ 工作台</a>
      <a data-page="slo" onclick="goPage('slo')">◫ 采集健康</a>
      <div class="nav-section">接入</div>
      <a data-page="resources" onclick="goPage('resources')">▦ 接入中心</a>
      <a data-page="targets" onclick="goPage('targets')">▤ 采集目标</a>
      <a data-page="changes" onclick="goPage('changes')">📋 变更中心</a>
      <div class="nav-section">采集能力</div>
      <a data-page="capabilities" onclick="goPage('capabilities')">🔌 插件与策略</a>
      <a data-page="versions" onclick="goPage('versions')">🧬 版本与兼容</a>
      <div class="nav-section">数据观测</div>
      <a data-page="metrics-browse" onclick="goPage('metrics-browse')">📈 指标大屏</a>
      <a data-page="data-gov" onclick="goPage('data-gov')">🧹 数据治理</a>
      <div class="nav-section">平台</div>
      <!-- 平台组顺序对齐设计稿 2.1 ⑤（⑩平台设置 → ⑪审计日志 → ⑫平台健康）：
           追问顺序=平台怎么配 → 谁在何时做了什么 → 平台自己活得好不好。 -->
      <a data-page="settings" onclick="goPage('settings')">⚙️ 平台设置</a>
      <a data-page="audit" onclick="goPage('audit')">📜 审计日志</a>
      <a data-page="platform-health" onclick="goPage('platform-health')">🩺 平台健康</a>
      <div class="nav-foot"><span id="nav-user">toptea@l0</span> · <span id="nav-ver">v0.4.0</span></div>
    </nav>

    <!-- Main -->
    <main>
      <div class="top">
        <div class="search" style="flex:0 0 auto">
          <label for="tenant-switch" style="font-size:11px;color:var(--muted);margin-right:6px">租户</label>
          <select id="tenant-switch" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:12px;cursor:pointer" onchange="window.changeTenant(this.value)"></select>
        </div>
        <div class="search">
          <input
            type="text"
            id="search-input"
            placeholder="搜索 Agent ID / IP / 租户…"
            onkeydown="if (event.key === 'Enter') doSearch();"
          />
        </div>
        <div class="stat-cards" id="stat-cards"></div>
      </div>
      <div class="content" id="main-content"></div>
    </main>

    <!-- Agent detail panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-hd">
        <h3 id="detail-title">Agent 详情</h3>
        <span class="detail-close" onclick="closeDetail()">✕</span>
      </div>
      <div class="detail-tabs">
        <span
          class="active"
          data-dtab="plugins"
          onclick="switchDetailTab('plugins')"
          >插件</span
        >
        <span data-dtab="config" onclick="switchDetailTab('config')">配置</span>
        <span data-dtab="metrics" onclick="switchDetailTab('metrics')"
          >指标</span
        >
        <span data-dtab="log" onclick="switchDetailTab('log')">日志</span>
        <span data-dtab="trouble" onclick="switchDetailTab('trouble')">🩺 排障</span>
      </div>
      <div class="detail-section" id="detail-content"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Batch confirm modal -->
    <div class="modal-overlay" id="batch-modal">
      <div class="modal">
        <h3 id="batch-modal-title">确认批量操作</h3>
        <div
          id="batch-modal-body"
          style="font-size: 13px; color: var(--muted); margin-bottom: 12px"
        ></div>
        <div class="modal-actions">
          <button class="btn btn-o" onclick="closeBatchModal()">取消</button>
          <button
            class="btn btn-d"
            id="batch-modal-confirm"
            onclick="confirmBatch()"
          >
            确认执行
          </button>
        </div>
      </div>
    </div>

    <!-- Install Modal -->
    <div class="modal-overlay" id="add-agent-modal">
      <div class="modal" style="max-width: 640px">
        <div id="install-body"></div>
      </div>
    </div>

    <script src="js/utils.js?v=32"></script>
    <script src="js/api.js?v=16"></script>
    <script src="js/fleet.js?v=16"></script>
    <script src="js/panel.js?v=32"></script>
    <script src="js/onboard.js?v=48"></script>
    <script src="js/version.js?v=4"></script>
    <script src="js/resources.js?v=20"></script>
    <script src="js/overview.js?v=8"></script>
    <script src="js/platform.js?v=5"></script>
    <script src="js/app.js?v=17"></script>
    <script>
      console.log("SAgent MVP v4 loaded @ " + new Date().toLocaleTimeString());
    </script>
  </body>
</html>
