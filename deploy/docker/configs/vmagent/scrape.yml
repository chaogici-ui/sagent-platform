# vmagent scrape 配置（vmagent 池版）
# 池成员 A/B 共用同一份 job 骨架（本文件两台 vmagent 挂同一 ro 路径），
# 目标归属由 l0-console 调度器写各自的 sd 目录（configs/vmagent-sd/pool-{a,b} →
# 容器内同路径 /etc/vmagent-sd-pool），单归属轮转：同一目标任一时刻只被一个成员抓取。
scrape_configs:
      # 成员自监控：每个 vmagent 抓自己容器内的 8429（本机地址，天然各抓各的）。
      # 关键作用：零归属目标的空闲成员也有 up 序列（带自己的 replica 标签），
      # 调度器数据面判活不会把"空闲"误判成"死了"，否则接管时唯一承接端会被误杀。
      - job_name: "vmagent-self"
        scrape_interval: 15s
        static_configs:
              - targets:
                      - "localhost:8429"
      # L0 自身自监控（架构 3.3 可监控：平台也要能被监控）。
      # l0-console 的 /metrics 出口 sagent_l0_*，与前端自监控面板、/api/selfmon 同源。
      - job_name: "l0-console"
        scrape_interval: 15s
        metrics_path: /metrics
        file_sd_configs:
              - files:
                      - "/etc/vmagent-sd-pool/l0-console/*.json"
      - job_name: "sagent"
        scrape_interval: 15s
        # D4 收口核心：SAgent /metrics 不再被 vmagent 直连，统一经 l1-vmauth 单端口(8427)收敛。
        #   - 入口鉴权：vmagent 带 Bearer demo-d4-bearer 打 vmauth，裸鉴权不通过即 401；
        #   - path 白名单：vmauth 按 /sagent-{N}/metrics 白名单路由并注入 SAgent 所需 Bearer；
        #   - 明细节奏：sd 里 targets 写 sagent-*,19090（逻辑标识），relabel 把 __address__ 置换为
        #     vmauth:8427、__metrics_path__ 按 host 映射到对应白名单 path（大盘标签兼容）。
        # vmagent 1.93 不展开配置文件 ${VAR}，密钥与 SAgent SAGENT_METRICS_AUTH_KEY、
        # configs/vmauth/auth.yaml 三处同步（生产轮换密钥时一并更新）。
        bearer_token: "demo-d4-bearer"
        file_sd_configs:
              - files:
                      - "/etc/vmagent-sd-pool/sagent/*.json"
        relabel_configs:
              - source_labels: [__address__]
                regex: "sagent-1:.*"
                target_label: __metrics_path__
                replacement: /sagent-1/metrics
              - source_labels: [__address__]
                regex: "sagent-2:.*"
                target_label: __metrics_path__
                replacement: /sagent-2/metrics
              - source_labels: [__address__]
                regex: "sagent-proxy:.*"
                target_label: __metrics_path__
                replacement: /sagent-proxy/metrics
              # 注意：Prometheus relabel 的 regex 两端锚定，"sagent-proxy:.*" 不会误命中 sagent-proxy-2
              - source_labels: [__address__]
                regex: "sagent-proxy-2:.*"
                target_label: __metrics_path__
                replacement: /sagent-proxy-2/metrics
              - source_labels: [__address__]
                regex: "sagent-proxy-3:.*"
                target_label: __metrics_path__
                replacement: /sagent-proxy-3/metrics
              # 保留各 SAgent 原标识作为 instance（默认 instance 取 __address__，若不保留会被置换后的
              # vmauth:8427 覆盖而全部合并成同一个 target，导致 Grafana 大盘无法区分主机）
              - source_labels: [__address__]
                target_label: instance
              # 任何以上 host 都把实际抓取地址统一置换为 vmauth 单端口
              - source_labels: [__address__]
                regex: "sagent-.*:.*"
                target_label: __address__
                replacement: "vmauth:8427"
      # MySQL 采集靶（vmagent 池演示目标：mysql-exp-1/2 stdlib 探针导出器）
      - job_name: "mysql"
        scrape_interval: 15s
        metrics_path: /metrics
        file_sd_configs:
              - files:
                      - "/etc/vmagent-sd-pool/mysql/*.json"
      # 接入流水线装机后自动登记的靶机（l0-console 池化登记，job=onboarded）
      - job_name: "onboarded"
        scrape_interval: 15s
        file_sd_configs:
              - files:
                      - "/etc/vmagent-sd-pool/onboarded/*.json"
